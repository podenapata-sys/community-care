<style>
  /* ===== Design system (Lumora-inspired: big two-tone headings, eyebrow chips, dark pill buttons, soft cards) ===== */
  :root {
    --navy: #0d2470; --ink-deep: #0a1440; --indigo: #1d3ea6; --cyan: #13b6e2; --teal: #0f9fb8;
    --cyan-soft: #e6f7fd; --ink: #14183a; --muted: #5b6285; --bg: #ffffff; --soft: #f5f7fc;
    --card: #ffffff; --line: #e6eaf3; --ok: #12a36b;

    --radius: 20px; --shadow: 0 10px 30px rgba(13,36,112,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {

  .review .ph { outline: 2px dashed #f5a524; outline-offset: 2px; border-radius: 4px; }
  .accent { color: var(--teal); }

  /* eyebrow chip */

    color: var(--navy); font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }
  .eyebrow::before { content: "✳"; color: var(--teal); font-size: 12px; }
  .on-dark .eyebrow { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22); color: #fff; }
  .on-dark .eyebrow::before { color: #6fdcf6; }

  /* buttons: dark pill with an arrow circle */

  .lang { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; color: var(--navy); }

  /* hero (dark gradient, no photo) */
  .hero { position: relative; overflow: hidden; color: #fff; padding: 88px 0 0;
    background: radial-gradient(900px 520px at 85% 10%, rgba(19,182,226,.38), transparent 60%),

  .hero::before { content: ""; position: absolute; inset: 0; opacity: .14; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.2px); background-size: 26px 26px;
    mask-image: linear-gradient(180deg, #000 0%, transparent 85%); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 85%); }
  .hero-grid { position: relative; display: grid; grid-template-columns: 1.2fr .8fr; gap: 48px; align-items: center; padding-bottom: 72px; }
  .hero h1 { font-size: clamp(34px, 5.6vw, 64px); line-height: 1.12; letter-spacing: -.015em; margin: 20px 0 18px; font-weight: 700; }
  .hero .lead { font-size: 18px; color: rgba(255,255,255,.82); max-width: 560px; margin-bottom: 30px; }
  .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; }
  .hero-card { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 26px;
    backdrop-filter: blur(10px); box-shadow: 0 30px 60px rgba(0,0,0,.18); }
  .hero-card h3 { font-size: 17px; margin-bottom: 12px; color: #fff; }
  .hours-row { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.14); font-size: 15px; color: rgba(255,255,255,.88); }

  /* info strip along the bottom of the hero */

  .strip > * { padding: 26px 24px; display: flex; gap: 14px; align-items: flex-start; color: rgba(255,255,255,.85); font-size: 14px; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .stat { border-radius: var(--radius); padding: 28px 24px; background: var(--soft); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .stat:nth-child(1) { background: var(--p1); } .stat:nth-child(2) { background: var(--p2); }
  .stat:nth-child(3) { background: var(--p3); } .stat:nth-child(4) { background: var(--p4); }
  .stat b { display: block; font-size: clamp(38px, 4.5vw, 54px); line-height: 1; color: var(--ink-deep); font-weight: 700; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 15px; }
  .stat i { position: absolute; right: 18px; top: 18px; font-style: normal; font-size: 22px; opacity: .9; }

  /* services: numbered pastel cards */
  .grid { display: grid; gap: 18px; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; transition: transform .25s, box-shadow .25s; }

  .svc-img { display: none; margin: -24px -24px 18px; aspect-ratio: 16 / 10; overflow: hidden; }

  .svc.has-img .num { margin-bottom: 6px; }
  .svc.has-img:hover .svc-img img { transform: scale(1.05); }
  .icon { width: 50px; height: 50px; border-radius: 14px; background: #fff; color: var(--indigo); display: grid; place-items: center; box-shadow: 0 4px 12px rgba(13,36,112,.06); }
  .icon svg { width: 24px; height: 24px; }
  .card h3 { font-size: 18px; color: var(--ink-deep); margin-bottom: 6px; }
  .card p { font-size: 14px; color: var(--muted); }

  /* doctors */
  .doc-search { display: block; max-width: 480px; margin: 0 auto 16px; }
  .doc-search input { margin: 0; border-radius: 999px; padding: 14px 20px; border: 1px solid var(--line); background: #fff; box-shadow: 0 6px 18px rgba(13,36,112,.06); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 32px; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--navy); border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 14px; cursor: pointer; transition: all .2s; }
  .chip span { color: var(--muted); font-size: 12px; }

  /* top half of the card: the doctor's photo, or a large initials panel until a photo is added */

  .doc.hl .doc-media { background: linear-gradient(135deg, #dff4fc, #dfe5ff); }

  .no-photo .ini svg { width: 30px; height: 30px; color: var(--teal); opacity: .8; }
  .doc h3 { padding: 0 20px; }

  .doc .spec { color: var(--teal); font-weight: 600; font-size: 14px; padding: 0 20px; }

  .doc .js-book { margin-bottom: 20px; }

  .star-badge.sh { background: var(--ink-deep); color: #ffd36b; }

  label { display: block; font-size: 14px; font-weight: 600; color: var(--ink-deep); margin-bottom: 6px; }
  input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 13px 14px;

  .success .btn { margin-top: 12px; background: #25d366; color: #fff; padding: 10px 18px; }

  /* FAQ */
  .faq { max-width: 860px; margin: 0 auto; }
  .faq details { border: 1px solid var(--line); border-radius: 18px; padding: 0 22px; margin-bottom: 12px; background: #fff; transition: box-shadow .2s; }
  .faq details[open] { box-shadow: var(--shadow); }
  .faq summary { list-style: none; cursor: pointer; padding: 20px 0; font-weight: 600; color: var(--ink-deep); font-size: 17px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 20px; color: var(--navy); transition: transform .25s; }
  .faq details[open] summary::after { transform: rotate(45deg); background: var(--ink-deep); color: #fff; }
  .faq details p { padding: 0 0 20px; color: var(--muted); }

  /* contact */
  .contact { background: var(--soft); }
  .contact-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 24px; }
  .contact-card { background: #fff; border-radius: var(--radius); padding: 26px; border: 1px solid var(--line); }
  .contact-item { display: flex; gap: 14px; margin-bottom: 22px; }
  .contact-item:last-child { margin-bottom: 0; }
  .contact-item .icon { margin: 0; flex: none; background: var(--cyan-soft); box-shadow: none; }
  .contact-item b { display: block; color: var(--ink-deep); }
  .contact-item span { color: var(--muted); font-size: 15px; }
  .contact-item a { color: var(--indigo); }
  .map { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); min-height: 340px; }
  .map iframe { width: 100%; height: 100%; min-height: 340px; border: 0; display: block; }

  /* CTA band + footer */
  .cta { padding: 0; }
  .cta-box { border-radius: 28px; padding: 48px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; color: #fff;
    background: radial-gradient(500px 300px at 100% 0%, rgba(19,182,226,.45), transparent 60%), linear-gradient(135deg, #0a1440, #1d3ea6); margin: 0 auto 96px; }
  .cta-box h2 { font-size: clamp(24px, 3.4vw, 36px); line-height: 1.2; max-width: 620px; }
  footer { background: var(--ink-deep); color: rgba(255,255,255,.72); padding: 36px 0; font-size: 14px; }
  .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; align-items: center; }
  .foot-logo { height: 36px; width: auto; display: block; margin-bottom: 10px; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

  /* floating buttons + mobile bar */
  .fab { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 30; }
  .fab a { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 8px 22px rgba(0,0,0,.2); color: #fff; }
  .fab .wa { background: #25d366; } .fab .call { background: var(--indigo); }
  .fab svg { width: 26px; height: 26px; }
  .mbar { display: none; }

  /* scroll reveal (only when JS runs; content is visible without JS) */
  /* photos (assets/img). A slot stays hidden until its photo loads (imgOk), so a missing file never flashes an empty box. */
  .ph-img { display: none; margin: 0; border-radius: 24px; overflow: hidden; box-shadow: 0 24px 50px rgba(13,36,112,.16); background: var(--soft); }
  .ph-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .ph-img.ok { display: block; }
  .hero-side { display: grid; gap: 18px; }
  .hero-side .ph-img { aspect-ratio: 16 / 10; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 30px 60px rgba(0,0,0,.25); }
  .media-row.has-img { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; margin-bottom: 48px; }
  .media-row.has-img > .sec-head { margin: 0; text-align: left; }
  .about-row .ph-img { aspect-ratio: 4 / 3; }
  .why-row.has-img { grid-template-columns: .8fr 1.2fr; align-items: stretch; margin-bottom: 0; }
  .why-row .ph-img { min-height: 320px; }
  .why-row .ph-img img { object-position: 40% center; }
  .hero-side .ph-img img { object-position: 45% center; }
  .lab-banner { aspect-ratio: 16 / 5; margin-bottom: 28px; }
  .js .reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s ease; }
  .js .reveal.in { opacity: 1; transform: none; }
  /* headings rise in word by word (split in JS; words only, so Bangla conjuncts stay intact) */
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: .14em 0; margin: -.14em 0; }
  .w > span { display: inline-block; }
  .js .reveal:not(.in) .w > span { transform: translateY(110%); }
  .js .reveal.in .w > span { transition: transform .85s cubic-bezier(.2,.75,.2,1); transition-delay: calc(var(--i, 0) * 70ms + 120ms); }
  /* cards in a grid come in one after another */
  .js .stagger > * { opacity: 0; transform: translateY(24px); }
  .js .stagger.in > * { opacity: 1; transform: none; transition: opacity .6s ease, transform .6s ease; transition-delay: calc(var(--d, 0) * 80ms); }
  /* photos settle from a slight zoom */
  .js .ph-img.reveal img { transform: scale(1.08); transition: transform 1.6s cubic-bezier(.2,.7,.2,1); }
  .js .ph-img.reveal.in img { transform: none; }
  /* scrolling department band */
  .marquee { background: var(--ink-deep); color: #fff; overflow: hidden; padding: 18px 0; border-top: 1px solid rgba(255,255,255,.1); }
  .marquee-track { display: flex; width: max-content; animation: mq 45s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state: paused; }
  .marquee-track span { display: inline-flex; align-items: center; gap: 22px; padding-right: 22px; font-size: 18px; font-weight: 600; white-space: nowrap; }
  .marquee-track span::after { content: "✦"; color: #6fdcf6; font-size: 14px; }
  @keyframes mq { to { transform: translateX(-50%); } }
  .hero::before { transform: translateY(var(--py, 0px)); }
  @media (prefers-reduced-motion: reduce) {
    .doc:hover .doc-media img { transform: none; }
    .js .reveal { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; }
    .js .reveal .w > span, .js .stagger > *, .js .ph-img.reveal img { transform: none !important; opacity: 1 !important; transition: none !important; }
    .marquee-track { animation: none; } .marquee { overflow-x: auto; } .hero::before { transform: none; }
  }

  @media (max-width: 960px) {
    .hero-grid, .book-grid, .contact-grid, .why-grid { grid-template-columns: 1fr; }
    .hero-side .ph-img { order: 2; }
    .media-row.has-img, .why-row.has-img { grid-template-columns: 1fr; gap: 28px; }
    .why-row .ph-img { min-height: 0; aspect-ratio: 16 / 10; }
    .lab-banner { aspect-ratio: 16 / 8; }
    .g4, .stats { grid-template-columns: repeat(2, 1fr); }
    .g3 { grid-template-columns: 1fr 1fr; }
    .nav-links { display: none; }
    .strip { grid-template-columns: 1fr; }
    .strip > * + * { border-left: 0; border-top: 1px solid rgba(255,255,255,.16); }
    section { padding: 72px 0; }
  }
  @media (max-width: 560px) {
    .g3, .row, .g4 { grid-template-columns: 1fr; }
    .stats { gap: 12px; } .stat { padding: 20px 18px; }
    .hero { padding-top: 48px; } .hero-grid { padding-bottom: 48px; }
    section { padding: 56px 0; }
    .brand img { height: 38px; }
    .nav-right .btn { display: none; }
    .search-btn .lbl { display: none; }
    .search-ov { padding-top: 16px; } .search-box { max-height: calc(100vh - 32px); }
    .fab { display: none; }
    body { padding-bottom: 76px; }
    .cta-box { padding: 30px 22px; margin-bottom: 56px; }
    form { padding: 22px 18px; }
    .chips { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; margin: 0 -20px 24px; padding: 0 20px 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; }
    .mbar { display: flex; gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line);
      box-shadow: 0 -6px 20px rgba(13,36,112,.08); transition: transform .2s; }
    .mbar .btn { flex: 1; padding: 12px 16px; }
    .mbar .btn-call { flex: 0 0 auto; background: #fff; color: var(--navy); border: 1px solid var(--navy); }
    .mbar.away { transform: translateY(110%); }
  }
</style>

<script>
// Clinic data (doctors, services, numbers) lives in assets/clinic-data.js;
// the Firebase connection lives in assets/config.js.
const CONFIG = window.CLINIC;

const ICONS = {
  steth: '<path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v3a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="12" r="2"/>',
  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
  lab:   '<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/>',
  scan:  '<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10M8 11h2l1-3 2 6 1-3h2"/>',
  baby:  '<circle cx="12" cy="7" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>',
  child: '<circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M8 11h8M9 21l3-6 3 6"/>',
  bed:   '<path d="M3 7v12M21 19v-6a3 3 0 0 0-3-3H10v6M3 16h18"/><circle cx="6.5" cy="12" r="1.5"/>',
  amb:   '<path d="M3 17V7h11v10M14 10h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/><path d="M8.5 9.5v4M6.5 11.5h4"/>'
};

let lang = "bn";
try { lang = localStorage.getItem("cc-lang") || "bn"; } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtPhone = p => p.length === 11 ? p.slice(0, 5) + "-" + p.slice(5) : p;

const staggerIndex = grid => [...grid.children].forEach((c, i) => c.style.setProperty("--d", Math.min(i, 8)));
function renderLists() {
  const two = n => lang === "bn" ? String(n).padStart(2, "0").replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]) : String(n).padStart(2, "0");
  document.getElementById("servicesGrid").innerHTML = CONFIG.services.map((s, i) => `
    <div class="card svc">
      ${s.img ? `<figure class="svc-img"><img src="assets/img/${s.img}.jpg" width="800" height="500" alt="" onload="this.closest('.svc').classList.add('has-img')"></figure>` : ""}
      <div class="num">[${two(i + 1)}]</div>
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[s.icon] || ""}</svg></div>
      <h3>${esc(lang === "bn" ? s.bn : s.en)}</h3>
      <p>${esc(lang === "bn" ? s.dbn : s.den)}</p>
    </div>`).join("");

  const present = Object.keys(CONFIG.depts).filter(k => CONFIG.doctors.some(d => d.dept === k));
  document.getElementById("docFilter").innerHTML = ["all", ...present].map(k => {
    const n = k === "all" ? CONFIG.doctors.length : CONFIG.doctors.filter(d => d.dept === k).length;
    const label = k === "all" ? (lang === "bn" ? "সব ডাক্তার" : "All") : CONFIG.depts[k][lang];
    return `<button type="button" class="chip${k === docFilter ? " on" : ""}" data-dept="${k}">${esc(label)} <span>${n}</span></button>`;
  }).join("");

  // Shareholders first, then highlighted doctors, then source order; "all" shows 9 until expanded.

const norm = t => toLatinDigits(String(t || "")).toLowerCase();

      go: () => { det.open = true; jump(det); } });
  });
  const info = [

    [L ? "ফোন ও যোগাযোগ" : "Phone & contact", CONFIG.reception || "", "ফোন কল যোগাযোগ রিসেপশন নম্বর whatsapp phone call contact reception number", "#contact"],
    [L ? "চেম্বারের সময়" : "Chamber hours", L ? "প্রতিদিন বিকাল ৩টা – রাত ৯টা" : "Daily 3 PM – 9 PM", "সময় সময়সূচি কখন খোলা চেম্বার time timing hours open when schedule", "#top"],

function renderSearch() {
  const L = lang === "bn", q = norm(searchEls.input.value).trim(), words = q.split(/\s+/).filter(Boolean);
  if (!words.length) {
    searchHits = [];
    const deps = Object.keys(CONFIG.depts).filter(k => CONFIG.doctors.some(d => d.dept === k));
    searchEls.res.innerHTML = `<h4>${L ? "জনপ্রিয় খোঁজ" : "Popular"}</h4><div class="search-chips">` +
      [...deps.slice(0, 8).map(k => CONFIG.depts[k][lang]), L ? "জরুরি" : "Emergency", L ? "ঠিকানা" : "Address", L ? "সময়" : "Hours"]
        .map(t => `<button type="button" data-q="${esc(t)}">${esc(t)}</button>`).join("") + "</div>";
    return;
  }
  // Every word must match; inside each group, hits in the title or subtitle come before background-only hits.
  const score = it => { const head = norm(it.title + " " + it.sub); return words.every(w => head.includes(w)) ? 2 : words.some(w => head.includes(w)) ? 1 : 0; };
  const groups = [];
  searchHits = [];
  searchIndex().filter(it => { const t = norm(it.text + " " + it.title); return words.every(w => t.includes(w)); })
    .forEach((it, i) => { if (!groups.includes(it.group)) groups.push(it.group); it.s = score(it); it.i = i; searchHits.push(it); });
  searchHits.sort((a, b) => groups.indexOf(a.group) - groups.indexOf(b.group) || b.s - a.s || a.i - b.i);
  const perGroup = {};
  searchHits = searchHits.filter(it => (perGroup[it.group] = (perGroup[it.group] || 0) + 1) <= 8);
  searchOn = searchHits.length ? 0 : -1;
  if (!searchHits.length) {
    searchEls.res.innerHTML = `<p class="empty">${L ? "কিছু পাওয়া যায়নি। অন্যভাবে লিখে দেখুন, অথবা" : "Nothing found. Try other words, or"} <a href="#" class="js-call" style="display:inline;padding:0">${L ? "রিসেপশনে কল করুন" : "call reception"}</a>${L ? "।" : "."}</p>`;
    applyContacts(); return;
  }
  let html = "", last = "";
  searchHits.forEach((it, i) => {
    if (it.group !== last) { html += `<h4>${esc(it.group)}</h4>`; last = it.group; }
    html += `<a href="#" role="option" data-hit="${i}"${i === searchOn ? ' class="on"' : ""}><b>${esc(it.title)}</b>${it.sub ? `<span>${esc(it.sub)}</span>` : ""}</a>`;
  });
  searchEls.res.innerHTML = html;
}

  searchReturn = document.activeElement;
  searchEls.ov.hidden = false; document.body.classList.add("search-open");
  renderSearch(); setTimeout(() => searchEls.input.focus(), 30);

searchEls.res.addEventListener("click", e => {

  if (chip) { searchEls.input.value = chip.dataset.q; renderSearch(); searchEls.input.focus(); return; }

document.addEventListener("keydown", e => {
  if (searchEls.ov.hidden) {
    if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
    return;
  }
  if (e.key === "Escape") return closeSearch();
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && searchHits.length) {
    e.preventDefault();
    searchOn = (searchOn + (e.key === "ArrowDown" ? 1 : -1) + searchHits.length) % searchHits.length;
    searchEls.res.querySelectorAll("[data-hit]").forEach(a => a.classList.toggle("on", +a.dataset.hit === searchOn));
    searchEls.res.querySelector(".on")?.scrollIntoView({ block: "nearest" });
  }
  if (e.key === "Enter" && searchOn >= 0 && document.activeElement === searchEls.input) { e.preventDefault(); searchHits[searchOn].go(); }
});

// Wrap each word of a heading in .w > span so it can rise in; keeps inner markup like .accent.
function splitWords(el) {
  let i = 0;
  const walk = node => [...node.childNodes].forEach(n => {
    if (n.nodeType === 1) return walk(n);
    if (n.nodeType !== 3 || !n.textContent.trim()) return;
    const frag = document.createDocumentFragment();
    n.textContent.split(/(\s+)/).forEach(part => {
      if (!part) return;
      if (/^\s+$/.test(part)) return frag.append(part);
      const w = document.createElement("span"), inner = document.createElement("span");
      w.className = "w"; inner.style.setProperty("--i", i++); inner.textContent = part;
      w.append(inner); frag.append(w);
    });
    n.replaceWith(frag);
  });
  walk(el);
}

  const bad = [...form.querySelectorAll("[required]")].filter(el => !validateField(el));
  if (bad.length) { bad[0].focus(); return; }
  const data = Object.fromEntries(new FormData(form));
  // Option values are "doc:<index>" or "svc:<index>" (see renderLists()).
  const [kind, ix] = (data.service || "").split(":");
  const doc = kind === "doc" ? CONFIG.doctors[+ix] : null;
  const svc = kind === "svc" ? CONFIG.services[+ix] : null;
  const doctor = doc ? doc.name : (svc ? svc.bn : data.service);
  const shownDoctor = doc ? docName(doc) : doctor;
  const dept = doc ? doc.dept : null;

  const btn = form.querySelector("button[type=submit]");
  btn.disabled = true;
  const msg = document.getElementById("successMsg");
  try {
    let serial = null;
    const db = await getDb();
    if (db) {
      ({ serial } = await db.createBooking({
        patient_name: data.name, phone: data.phone, age: data.age || null,
        booking_date: data.date, doctor, dept, note: data.note || null
      }, "online"));
    }
    msg.style.background = ""; msg.style.color = "";
    const bnN = t => lang === "bn" ? String(t).replace(/\d/g, c => "০১২৩৪৫৬৭৮৯"[c]) : String(t);
    const when = new Date(data.date + "T00:00:00Z").toLocaleDateString(lang === "bn" ? "bn-BD" : "en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
    const waHref = (document.querySelector(".js-wa") || {}).href || "#";
    const waText = encodeURIComponent(lang === "bn"
      ? `আসসালামু আলাইকুম, আমি ${data.name}। ${when} ${shownDoctor}-এর কাছে সিরিয়াল নিয়েছি${serial ? ` (নম্বর ${serial})` : ""}।`
      : `Hello, I am ${data.name}. I booked ${shownDoctor} for ${when}${serial ? ` (serial ${serial})` : ""}.`);
    msg.innerHTML = lang === "bn"
      ? `<div class="big">ধন্যবাদ ${esc(data.name)}! ✅</div>` +
        (serial ? `<div>${esc(shownDoctor)}-এর কাছে আপনার সিরিয়াল নম্বর:<span class="serial-no">${bnN(serial)}</span></div>` : `<div>আপনার অনুরোধ পেয়েছি।</div>`) +
        `<div>📅 ${esc(when)} · চেম্বারে এসে এই নম্বর বলুন।</div><div>শীঘ্রই ${esc(data.phone)} নম্বরে কনফার্ম করা হবে।</div>`
      : `<div class="big">Thank you ${esc(data.name)}! ✅</div>` +
        (serial ? `<div>Your serial number with ${esc(shownDoctor)}:<span class="serial-no">${serial}</span></div>` : `<div>We received your request.</div>`) +
        `<div>📅 ${esc(when)} · Tell this number at the chamber.</div><div>We will confirm on ${esc(data.phone)} shortly.</div>`;
    if (/wa\.me/.test(waHref)) msg.innerHTML += `<a class="btn btn-sm" target="_blank" rel="noopener" href="${esc(waHref.split("?")[0])}?text=${waText}">${lang === "bn" ? "WhatsApp-এ জানান" : "Message on WhatsApp"}</a>`;
    msg.style.display = "block";
    msg.scrollIntoView({ behavior: "smooth", block: "center" });
    form.reset(); dateInput.value = dhakaToday(); updateHint();
  } catch (err) {
    const tooMany = /too_many_bookings/.test(err && err.message);
    msg.style.background = "#fdecee"; msg.style.color = "#9b1c31";
    msg.textContent = tooMany
      ? (lang === "bn" ? "এই নম্বর থেকে ওই দিনে ইতিমধ্যে ৩টি সিরিয়াল নেওয়া হয়েছে। অনুগ্রহ করে কল করুন।" : "This number already has 3 bookings that day. Please call us.")
      : (lang === "bn" ? "দুঃখিত, পাঠানো যায়নি। অনুগ্রহ করে কল করুন।" : "Sorry, that didn't go through. Please call us.");
    msg.style.display = "block";
    msg.scrollIntoView({ behavior: "smooth", block: "center" });
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("yr").textContent = new Date().getFullYear();
// Staff shortcut: three quick taps on the footer logo open the dashboard.
(() => {
  let taps = 0, t;
  document.querySelector(".foot-logo").addEventListener("click", () => {
    clearTimeout(t);
    if (++taps >= 3) { taps = 0; location.href = "dashboard/"; return; }
    t = setTimeout(() => { taps = 0; }, 700);
  });
})();
if (/[?&]review=1\b/.test(location.search)) document.body.classList.add("review");
// Number counters (animate once when first seen) and fade-in on scroll.
const countState = new WeakMap();   // element -> value currently shown while animating
function fmtCount(el, v) {
  const n = lang === "bn" ? Number(v).toLocaleString("bn-BD") : String(v);
  const suf = el.dataset[lang + "suffix"] ?? el.dataset.suffix ?? "";
  return n + (lang === "bn" ? suf.replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]) : suf);
}
function paintCounts() {
  document.querySelectorAll(".count").forEach(el => {
    el.textContent = fmtCount(el, countState.has(el) ? countState.get(el) : (+el.dataset.to || 0));
  });
}
function runCount(el) {
  const to = +el.dataset.to || 0, t0 = performance.now(), dur = 1200;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), v = Math.round(to * (1 - Math.pow(1 - k, 3)));
    countState.set(el, v); el.textContent = fmtCount(el, v);
    if (k < 1) requestAnimationFrame(step); else countState.delete(el);
  };
  countState.set(el, 0); el.textContent = fmtCount(el, 0); requestAnimationFrame(step);
}
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!("IntersectionObserver" in window) || reduce) { document.querySelectorAll(".reveal, .stagger").forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in"); io.unobserve(e.target);
    e.target.querySelectorAll(".count").forEach(runCount);
  }), { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
  document.querySelectorAll(".reveal").forEach(e => {
    const sibs = [...e.parentElement.children].filter(c => c.classList.contains("reveal"));
    if (sibs.length > 1) e.style.transitionDelay = (sibs.indexOf(e) % 4) * 90 + "ms";
    io.observe(e);
  });
  const sio = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    staggerIndex(e.target); e.target.classList.add("in"); sio.unobserve(e.target);
  }), { threshold: 0.05 });
  document.querySelectorAll(".stagger").forEach(g => sio.observe(g));
  const hero = document.querySelector(".hero");
  let ticking = false;
  addEventListener("scroll", () => {
    if (ticking || scrollY > innerHeight) return;
    ticking = true;
    requestAnimationFrame(() => { hero.style.setProperty("--py", scrollY * 0.3 + "px"); ticking = false; });
  }, { passive: true });
})();
// Hide the mobile bottom bar while the booking form is on screen.
if ("IntersectionObserver" in window) {
  new IntersectionObserver(([e]) => document.getElementById("mbar").classList.toggle("away", e.isIntersecting), { threshold: 0.15 })
    .observe(document.getElementById("bookingForm"));
}
applyLang();
applyContacts();
</script>
</body>
