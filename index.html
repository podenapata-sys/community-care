<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Care Hospital & Diagnostic — Khulna</title>
<meta name="description" content="Community Care Hospital & Diagnostic, Tetultola Mor, Khulna. Book doctor appointments and diagnostic tests online.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d2470">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="apple-touch-icon" href="assets/logo-mark.png">
<meta property="og:title" content="কমিউনিটি কেয়ার হাসপাতাল এন্ড ডায়াগনস্টিক">
<meta property="og:description" content="তেঁতুলতলা মোড়, খুলনা — অনলাইনে ডাক্তারের সিরিয়াল নিন">
<meta property="og:image" content="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d2470;
    --indigo: #1d3ea6;
    --cyan: #13b6e2;
    --cyan-soft: #e6f7fd;
    --ink: #14183a;
    --muted: #5b6285;
    --bg: #f6f8fc;
    --card: #ffffff;
    --line: #e3e7f2;
    --ok: #12a36b;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Hind Siliguri", "Inter", system-ui, sans-serif;
    color: var(--ink); background: var(--bg); line-height: 1.6;
  }
  body.en { font-family: "Inter", "Hind Siliguri", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* Placeholder marker — remove class once real data is in */
  .ph { outline: 2px dashed #f5a524; outline-offset: 2px; border-radius: 4px; }
  .demo-bar {
    background: #fff4dd; color: #7a4b00; font-size: 13px; text-align: center; padding: 6px 16px;
  }

  /* Header */
  header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { height: 46px; width: auto; display: block; }
  .foot-logo { height: 36px; width: auto; display: block; margin-bottom: 8px; }
  .nav-links { display: flex; gap: 22px; font-weight: 500; color: var(--muted); }
  .nav-links a:hover { color: var(--indigo); }
  .nav-right { display: flex; gap: 8px; align-items: center; }
  .lang {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--navy);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 600;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--cyan); color: #04263a; }
  .btn-primary:hover { box-shadow: 0 6px 18px rgba(31,182,232,.35); }
  .btn-ghost { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.35); }
  .btn-sm { padding: 8px 14px; font-size: 14px; }

  /* Hero */
  .hero {
    background: radial-gradient(1200px 500px at 85% 20%, rgba(31,182,232,.35), transparent 60%),
                linear-gradient(135deg, var(--navy), var(--indigo));
    color: #fff; padding: 64px 0 72px;
  }
  .hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; }
  .pill {
    display: inline-block; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
    padding: 4px 12px; border-radius: 999px; font-size: 13px; margin-bottom: 16px;
  }
  .hero h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.15; margin-bottom: 14px; }
  .hero p { font-size: 18px; opacity: .9; max-width: 540px; margin-bottom: 26px; }
  .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; }
  .hero-stats { display: flex; gap: 28px; margin-top: 34px; flex-wrap: wrap; }
  .stat b { display: block; font-size: 26px; }
  .stat span { font-size: 13px; opacity: .8; }
  .hero-card {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px; padding: 24px; backdrop-filter: blur(6px);
  }
  .hero-card h3 { font-size: 16px; margin-bottom: 14px; }
  .hours-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.15); font-size: 15px; }
  .hours-row:last-child { border-bottom: 0; }
  .emergency {
    margin-top: 16px; background: #ff4d6d; color: #fff; border-radius: 12px; padding: 14px;
    display: flex; justify-content: space-between; align-items: center; font-weight: 600; gap: 10px;
  }

  /* Sections */
  section { padding: 72px 0; }
  .sec-head { text-align: center; max-width: 620px; margin: 0 auto 40px; }
  .sec-head .kicker { color: var(--cyan); font-weight: 600; font-size: 14px; letter-spacing: .04em; }
  .sec-head h2 { font-size: clamp(24px, 3.4vw, 34px); color: var(--navy); margin: 6px 0 8px; }
  .sec-head p { color: var(--muted); }

  .grid { display: grid; gap: 18px; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(30,42,120,.08); }
  .icon {
    width: 46px; height: 46px; border-radius: 12px; background: var(--cyan-soft); color: var(--indigo);
    display: grid; place-items: center; margin-bottom: 14px;
  }
  .icon svg { width: 24px; height: 24px; }
  .card h3 { font-size: 17px; color: var(--navy); margin-bottom: 4px; }
  .card p { font-size: 14px; color: var(--muted); }

  .doc { text-align: center; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 12px;
    background: linear-gradient(135deg, var(--cyan-soft), #dfe3fb); display: grid; place-items: center;
    color: var(--indigo); font-size: 30px; font-weight: 700;
  }
  .doc .spec { color: var(--cyan); font-weight: 600; font-size: 14px; }
  .doc .deg { font-size: 12px; color: var(--muted); margin: 2px auto 4px; display: inline-block; }
  .doc { display: flex; flex-direction: column; align-items: center; }
  .doc .work { font-size: 13px; color: var(--muted); margin: 8px 0 14px; }
  .doc .btn { margin-top: auto; }
  .doc .call-link { font-size: 12px; color: var(--indigo); margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--navy); border-radius: 999px;
    padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .chip span { color: var(--muted); font-size: 12px; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip.on span { color: rgba(255,255,255,.75); }

  /* Booking */
  .book { background: var(--card); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .book-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
  .steps { list-style: none; margin-top: 20px; }
  .steps li { display: flex; gap: 14px; margin-bottom: 18px; }
  .steps .n {
    flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--indigo); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 14px;
  }
  .steps b { color: var(--navy); }
  .steps p { color: var(--muted); font-size: 14px; }
  form { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 12px; font: inherit; font-size: 15px; color: var(--ink); margin-bottom: 14px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--cyan); border-color: transparent; }
  .form-note { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }
  .success {
    display: none; background: #e7f8f0; border: 1px solid #b6ead3; color: #0b6b46;
    padding: 16px; border-radius: 12px; margin-top: 14px; font-weight: 500;
  }

  /* Contact */
  .contact-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 24px; }
  .contact-item { display: flex; gap: 14px; margin-bottom: 20px; }
  .contact-item .icon { margin: 0; flex: none; }
  .contact-item b { display: block; color: var(--navy); }
  .contact-item span { color: var(--muted); font-size: 15px; }
  .map { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); min-height: 320px; }
  .map iframe { width: 100%; height: 100%; min-height: 320px; border: 0; display: block; }

  footer { background: var(--navy); color: rgba(255,255,255,.75); padding: 28px 0; font-size: 14px; }
  .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }

  /* Floating actions */
  .fab { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 30; }
  .fab a, .fab button {
    width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; border: 0; cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,.2); color: #fff;
  }
  .fab .wa { background: #25d366; }
  .fab .call { background: var(--indigo); }
  .fab svg { width: 26px; height: 26px; }

  @media (max-width: 900px) {
    .hero-grid, .book-grid, .contact-grid { grid-template-columns: 1fr; }
    .g4 { grid-template-columns: repeat(2, 1fr); }
    .g3 { grid-template-columns: 1fr 1fr; }
    .nav-links { display: none; }
  }
  @media (max-width: 560px) {
    .g3, .row { grid-template-columns: 1fr; }
    .g4 { gap: 12px; }
    .g4 .card { padding: 16px; }
    .hero { padding: 44px 0 52px; }
    section { padding: 52px 0; }
    .brand img { height: 38px; }
    .nav-right .btn { display: none; }
  }
</style>
</head>
<body>

<div class="demo-bar" data-bn="ডেমো প্রিভিউ — চূড়ান্ত তথ্য হাসপাতাল থেকে সংগ্রহের পর যুক্ত হবে" data-en="Demo preview — final details will be added once provided by the hospital"></div>

<header>
  <div class="wrap nav">
    <a href="#" class="brand">
      <img src="assets/logo.png" width="178" height="46" alt="কমিউনিটি কেয়ার হাসপাতাল এন্ড ডায়াগনস্টিক — Community Care Hospital & Diagnostic">
    </a>
    <nav class="nav-links">
      <a href="#services" data-bn="সেবাসমূহ" data-en="Services"></a>
      <a href="#doctors" data-bn="ডাক্তার" data-en="Doctors"></a>
      <a href="#book" data-bn="অ্যাপয়েন্টমেন্ট" data-en="Appointment"></a>
      <a href="#contact" data-bn="যোগাযোগ" data-en="Contact"></a>
    </nav>
    <div class="nav-right">
      <button class="lang" id="langBtn">English</button>
      <a href="#book" class="btn btn-primary btn-sm" data-bn="সিরিয়াল নিন" data-en="Book Now"></a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <span class="pill" data-bn="📍 তেঁতুলতলা মোড়, খুলনা" data-en="📍 Tetultola Mor, Khulna"></span>
      <h1 data-bn="লাইনে না দাঁড়িয়ে, ঘরে বসেই ডাক্তারের সিরিয়াল নিন" data-en="Skip the queue. Book your doctor from home."></h1>
      <p data-bn="বিশেষজ্ঞ ডাক্তার, আধুনিক ডায়াগনস্টিক ও ২৪/৭ জরুরি সেবা — এক জায়গায়। ২ মিনিটে অনলাইনে অ্যাপয়েন্টমেন্ট বুক করুন, WhatsApp-এ কনফার্মেশন পান।" data-en="Specialist doctors, modern diagnostics and 24/7 emergency care in one place. Book online in 2 minutes and get confirmation on WhatsApp."></p>
      <div class="hero-ctas">
        <a href="#book" class="btn btn-primary" data-bn="অ্যাপয়েন্টমেন্ট বুক করুন" data-en="Book Appointment"></a>
        <a href="#" class="btn btn-ghost js-call" data-bn="📞 কল করুন" data-en="📞 Call Us"></a>
      </div>
      <div class="hero-stats">
        <div class="stat"><b>18+</b><span data-bn="বিশেষজ্ঞ ডাক্তার" data-en="Specialist doctors"></span></div>
        <div class="stat"><b class="ph">XX+</b><span data-bn="ডায়াগনস্টিক টেস্ট" data-en="Diagnostic tests"></span></div>
        <div class="stat"><b>24/7</b><span data-bn="জরুরি সেবা" data-en="Emergency"></span></div>
      </div>
    </div>
    <div class="hero-card">
      <h3 data-bn="🕒 সেবার সময়" data-en="🕒 Opening Hours"></h3>
      <div class="hours-row"><span data-bn="শনি – বৃহস্পতি" data-en="Sat – Thu"></span><span class="ph">9:00 AM – 10:00 PM</span></div>
      <div class="hours-row"><span data-bn="শুক্রবার" data-en="Friday"></span><span class="ph">3:00 PM – 10:00 PM</span></div>
      <div class="hours-row"><span data-bn="ডায়াগনস্টিক রিপোর্ট" data-en="Report delivery"></span><span class="ph">Same day</span></div>
      <a href="#" class="emergency js-emergency">
        <span data-bn="🚑 জরুরি প্রয়োজনে" data-en="🚑 Emergency"></span>
        <span class="js-emergency-text ph">01XXX-XXXXXX</span>
      </a>
    </div>
  </div>
</section>

<section id="services">
  <div class="wrap">
    <div class="sec-head">
      <div class="kicker" data-bn="আমাদের সেবা" data-en="OUR SERVICES"></div>
      <h2 data-bn="আপনার প্রয়োজনীয় সব চিকিৎসা এক ছাদের নিচে" data-en="Everything you need under one roof"></h2>
      <p class="ph" data-bn="চূড়ান্ত সেবার তালিকা হাসপাতাল থেকে নিশ্চিত করা হবে" data-en="Final service list to be confirmed by the hospital"></p>
    </div>
    <div class="grid g4" id="servicesGrid"></div>
  </div>
</section>

<section id="doctors" style="padding-top:0">
  <div class="wrap">
    <div class="sec-head">
      <div class="kicker" data-bn="বিশেষজ্ঞ ডাক্তার" data-en="SPECIALISTS"></div>
      <h2 data-bn="আমাদের অভিজ্ঞ বিশেষজ্ঞ ডাক্তারগণ" data-en="Our experienced specialists"></h2>
    </div>
    <div class="chips" id="docFilter"></div>
    <div class="grid g3" id="doctorsGrid"></div>
  </div>
</section>

<section id="book" class="book">
  <div class="wrap book-grid">
    <div>
      <div class="sec-head" style="text-align:left;margin:0">
        <div class="kicker" data-bn="অনলাইন সিরিয়াল" data-en="ONLINE BOOKING"></div>
        <h2 data-bn="৩ ধাপে অ্যাপয়েন্টমেন্ট" data-en="Book in 3 steps"></h2>
      </div>
      <ul class="steps">
        <li><span class="n">১</span><div><b data-bn="ফর্ম পূরণ করুন" data-en="Fill the form"></b><p data-bn="নাম, ফোন নম্বর ও ডাক্তার/টেস্ট বেছে নিন" data-en="Your name, phone and the doctor or test you need"></p></div></li>
        <li><span class="n">২</span><div><b data-bn="কনফার্মেশন পান" data-en="Get confirmation"></b><p data-bn="কয়েক মিনিটের মধ্যে WhatsApp/SMS-এ সিরিয়াল নম্বর" data-en="Serial number on WhatsApp/SMS within minutes"></p></div></li>
        <li><span class="n">৩</span><div><b data-bn="সময়মতো আসুন" data-en="Arrive on time"></b><p data-bn="লাইনে দাঁড়ানোর ঝামেলা নেই" data-en="No waiting in line"></p></div></li>
      </ul>
    </div>

    <form id="bookingForm" novalidate>
      <div class="row">
        <div><label for="f-name" data-bn="রোগীর নাম *" data-en="Patient name *"></label><input id="f-name" name="name" required></div>
        <div><label for="f-phone" data-bn="মোবাইল নম্বর *" data-en="Mobile number *"></label><input id="f-phone" name="phone" type="tel" inputmode="tel" pattern="01[3-9][0-9]{8}" placeholder="01XXXXXXXXX" required></div>
      </div>
      <div class="row">
        <div><label for="f-age" data-bn="বয়স" data-en="Age"></label><input id="f-age" name="age" type="number" min="0" max="120"></div>
        <div><label for="f-date" data-bn="তারিখ *" data-en="Date *"></label><input id="f-date" name="date" type="date" required></div>
      </div>
      <label for="f-service" data-bn="ডাক্তার / সেবা *" data-en="Doctor / Service *"></label>
      <select id="f-service" name="service" required></select>
      <label for="f-note" data-bn="সমস্যা সংক্ষেপে (ঐচ্ছিক)" data-en="Short note (optional)"></label>
      <textarea id="f-note" name="note" rows="3"></textarea>
      <button type="submit" class="btn btn-primary" style="width:100%" data-bn="সিরিয়াল কনফার্ম করুন" data-en="Confirm Booking"></button>
      <div class="success" id="successMsg"></div>
      <p class="form-note" data-bn="আপনার তথ্য শুধুমাত্র অ্যাপয়েন্টমেন্টের জন্য ব্যবহার হবে।" data-en="Your details are used only for your appointment."></p>
    </form>
  </div>
</section>

<section id="contact">
  <div class="wrap">
    <div class="sec-head">
      <div class="kicker" data-bn="যোগাযোগ" data-en="CONTACT"></div>
      <h2 data-bn="আমাদের খুঁজে নিন" data-en="Find us"></h2>
    </div>
    <div class="contact-grid">
      <div>
        <div class="contact-item">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
          <div><b data-bn="ঠিকানা" data-en="Address"></b><span data-bn="১৯ কেডিএ এভিনিউ, মোহসেন টাওয়ার, তেঁতুলতলা মোড়, খুলনা" data-en="19 KDA Avenue, Mohsen Tower, Tetultola Mor, Khulna"></span></div>
        </div>
        <div class="contact-item">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></div>
          <div><b data-bn="ফোন" data-en="Phone"></b><span><span data-bn="রিসেপশন" data-en="Reception"></span>: <span class="js-reception-text ph">01XXX-XXXXXX</span></span><br><span><span data-bn="জরুরি" data-en="Emergency"></span>: <span class="js-emergency-text ph">01XXX-XXXXXX</span></span><br><span><span data-bn="ডাক্তারের সিরিয়াল" data-en="Doctor serial"></span>: <span class="js-serial-list"></span></span></div>
        </div>
        <div class="contact-item">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
          <div><b data-bn="সময়" data-en="Hours"></b><span class="ph" data-bn="শনি–বৃহস্পতি ৯টা – রাত ১০টা" data-en="Sat–Thu 9 AM – 10 PM"></span></div>
        </div>
      </div>

        <iframe loading="lazy" title="Map" src="https://www.google.com/maps?q=Tetultola+Mor,+KDA+Avenue,+Khulna&output=embed"></iframe>
      </div>

  </div>
</section>

    <span data-bn="তেঁতুলতলা মোড়, খুলনা" data-en="Tetultola Mor, Khulna"></span>
  </div>
</footer>

<div class="fab">
  <a href="#" class="wa js-wa" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.8 11.8 0 0 0 1.9 17.7L.3 23.7l6.1-1.6a11.8 11.8 0 0 0 5.6 1.4h.1A11.8 11.8 0 0 0 20.5 3.5zM12 21.4a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.6.9 1-3.5-.2-.4A9.8 9.8 0 1 1 12 21.4zm5.4-7.3c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-.9 1.2-.3.2-.6.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.6-2c-.2-.3 0-.5.1-.6l.4-.5.3-.5v-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6a1.1 1.1 0 0 0-.8.4 3.3 3.3 0 0 0-1 2.5 5.8 5.8 0 0 0 1.2 3.1 13.3 13.3 0 0 0 5.1 4.5c1.9.8 2.6.9 3.6.7a3 3 0 0 0 2-1.4 2.4 2.4 0 0 0 .2-1.4c-.1-.2-.3-.2-.6-.4z"/></svg>

  </a>
</div>

<script src="assets/clinic-data.js"></script>
<script src="assets/config.js"></script>
<script>
// Clinic data (doctors, services, numbers) lives in assets/clinic-data.js;
// the Supabase connection lives in assets/config.js.
const CONFIG = window.CLINIC;

const ICONS = {
  steth: '<path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v3a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="12" r="2"/>',
  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
  lab:   '<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/>',
  scan:  '<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10M8 11h2l1-3 2 6 1-3h2"/>',
  baby:  '<circle cx="12" cy="7" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>',
  child: '<circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M8 11h8M9 21l3-6 3 6"/>',
  bed:   '<path d="M3 7v12M21 19v-6a3 3 0 0 0-3-3H10v6M3 16h18"/><circle cx="6.5" cy="12" r="1.5"/>',
  amb:   '<path d="M3 17V7h11v10M14 10h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/><path d="M8.5 9.5v4M6.5 11.5h4"/>'
};

let lang = "bn";
try { lang = localStorage.getItem("cc-lang") || "bn"; } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtPhone = p => p.length === 11 ? p.slice(0, 5) + "-" + p.slice(5) : p;

function renderLists() {
  document.getElementById("servicesGrid").innerHTML = CONFIG.services.map(s => `
    <div class="card">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[s.icon] || ""}</svg></div>
      <h3>${esc(lang === "bn" ? s.bn : s.en)}</h3>
      <p>${esc(lang === "bn" ? s.dbn : s.den)}</p>
    </div>`).join("");

  const present = Object.keys(CONFIG.depts).filter(k => CONFIG.doctors.some(d => d.dept === k));
  document.getElementById("docFilter").innerHTML = ["all", ...present].map(k => {
    const n = k === "all" ? CONFIG.doctors.length : CONFIG.doctors.filter(d => d.dept === k).length;
    const label = k === "all" ? (lang === "bn" ? "সব ডাক্তার" : "All") : CONFIG.depts[k][lang];
    return `<button type="button" class="chip${k === docFilter ? " on" : ""}" data-dept="${k}">${esc(label)} <span>${n}</span></button>`;
  }).join("");

  document.getElementById("doctorsGrid").innerHTML = CONFIG.doctors.map((d, i) => d.dept !== docFilter && docFilter !== "all" ? "" : `
    <div class="card doc">
      <div class="avatar">${esc(initials(d.name))}</div>
      <h3>${esc(d.name)}</h3>
      <div class="deg">${esc(d.deg)}</div>
      <div class="spec">${esc(lang === "bn" ? d.sbn : d.sen)}</div>
      <div class="work${d.unconfirmed ? " ph" : ""}">🏥 ${esc(d.work)}</div>
      <a href="#book" class="btn btn-primary btn-sm js-book" data-doc="${i}">${lang === "bn" ? "সিরিয়াল নিন" : "Book"}</a>
      <a href="#" class="call-link js-call">${lang === "bn" ? "📞 চেম্বারের সময় জানতে কল করুন" : "📞 Call for chamber time"}</a>
    </div>`).join("");

  const sel = document.getElementById("f-service");
  const opts = [...CONFIG.doctors.map(d => `${d.name} — ${lang === "bn" ? d.sbn : d.sen}`),
                ...CONFIG.services.map(s => lang === "bn" ? s.bn : s.en)];
  sel.innerHTML = `<option value="">${lang === "bn" ? "বেছে নিন" : "Select"}</option>` +
    opts.map(o => `<option>${esc(o)}</option>`).join("");
  applyContacts();
}

let docFilter = "all";
const initials = name => {
  const words = name.replace(/^(Dr\.|ডাঃ)\s*/, "").replace(/^Md\.\s*/, "").split(/\s+/);
  return /[A-Za-z]/.test(words[0]) ? (words[0][0] + (words[1] ? words[1][0] : "")).toUpperCase() : words[0][0];
};

document.getElementById("doctors").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { docFilter = chip.dataset.dept; renderLists(); return; }
  const book = e.target.closest(".js-book");
  if (book) document.getElementById("f-service").selectedIndex = +book.dataset.doc + 1;
});

function applyLang() {
  document.documentElement.lang = lang;
  document.body.classList.toggle("en", lang === "en");
  document.querySelectorAll("[data-bn]").forEach(el => { el.textContent = el.dataset[lang]; });
  document.getElementById("langBtn").textContent = lang === "bn" ? "English" : "বাংলা";
  renderLists();
}

function applyContacts() {
  const valid = p => /^01[3-9]\d{8}$/.test(p || "");
  const setNumber = (linkSel, textSel, num) => {
    if (!valid(num)) return;
    document.querySelectorAll(linkSel).forEach(a => a.href = "tel:+88" + num);
    document.querySelectorAll(textSel).forEach(el => { el.textContent = fmtPhone(num); el.classList.remove("ph"); });
  };
  setNumber(".js-call", ".js-reception-text", CONFIG.reception);
  setNumber(".js-emergency", ".js-emergency-text", CONFIG.emergency);
  document.querySelectorAll(".js-serial-list").forEach(el => {
    el.innerHTML = CONFIG.serial.filter(valid).map(p => `<a href="tel:+88${p}">${fmtPhone(p)}</a>`).join(", ");
  });
  const primary = valid(CONFIG.reception) ? CONFIG.reception : "";
  const wa = CONFIG.whatsapp || (primary ? "88" + primary : "");
  document.querySelectorAll(".js-wa").forEach(a => {
    a.href = wa ? `https://wa.me/${wa}?text=${encodeURIComponent("আসসালামু আলাইকুম, আমি একটি অ্যাপয়েন্টমেন্ট নিতে চাই।")}` : "#book";
    if (wa) { a.target = "_blank"; a.rel = "noopener"; }
  });
}

document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "bn" ? "en" : "bn";
  try { localStorage.setItem("cc-lang", lang); } catch (e) {}
  applyLang();
});

// Supabase client, loaded only when assets/config.js is filled in.
let dbPromise = null;
function getDb() {
  const cfg = window.APP_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return Promise.resolve(null);
  dbPromise = dbPromise || new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload = () => resolve(window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey));
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return dbPromise;
}

const dateInput = document.getElementById("f-date");
dateInput.min = new Date().toISOString().split("T")[0];

document.getElementById("bookingForm").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target;
  if (!form.checkValidity()) { form.reportValidity(); return; }
  const data = Object.fromEntries(new FormData(form));
  // Options are doctors first, then services (see renderLists()).
  const idx = document.getElementById("f-service").selectedIndex - 1;
  const doc = CONFIG.doctors[idx];
  const svc = doc ? null : CONFIG.services[idx - CONFIG.doctors.length];
  const doctor = doc ? doc.name : (svc ? svc.bn : data.service);
  const dept = doc ? doc.dept : null;

  const btn = form.querySelector("button[type=submit]");
  btn.disabled = true;
  const msg = document.getElementById("successMsg");
  try {
    let serial = null;
    const db = await getDb();
    if (db) {
      const { data: s, error } = await db.rpc("create_booking", {
        p_name: data.name, p_phone: data.phone, p_age: data.age ? +data.age : null,
        p_date: data.date, p_doctor: doctor, p_dept: dept, p_note: data.note || null
      });
      if (error) throw error;
      serial = s;
    }
    msg.style.background = ""; msg.style.color = "";
    msg.textContent = serial
      ? (lang === "bn"
          ? `ধন্যবাদ ${data.name}! ${doctor}-এর কাছে আপনার সিরিয়াল নম্বর: ${serial}। শীঘ্রই ${data.phone} নম্বরে কনফার্ম করা হবে।`
          : `Thank you ${data.name}! Your serial number with ${doctor} is ${serial}. We will confirm on ${data.phone} shortly.`)
      : (lang === "bn"
          ? `ধন্যবাদ ${data.name}! আপনার অনুরোধ পেয়েছি। শীঘ্রই ${data.phone} নম্বরে সিরিয়াল কনফার্ম করা হবে।`
          : `Thank you ${data.name}! We received your request and will confirm your serial on ${data.phone} shortly.`);
    msg.style.display = "block";
    form.reset();
  } catch (err) {
    const tooMany = /too_many_bookings/.test(err && err.message);
    msg.style.background = "#fdecee"; msg.style.color = "#9b1c31";
    msg.textContent = tooMany
      ? (lang === "bn" ? "এই নম্বর থেকে ওই দিনে ইতিমধ্যে ৩টি সিরিয়াল নেওয়া হয়েছে। অনুগ্রহ করে কল করুন।" : "This number already has 3 bookings that day. Please call us.")
      : (lang === "bn" ? "দুঃখিত, পাঠানো যায়নি। অনুগ্রহ করে কল করুন।" : "Sorry, that didn't go through. Please call us.");
    msg.style.display = "block";
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("yr").textContent = new Date().getFullYear();
applyLang();
applyContacts();
</script>
</body>
</html>
